name: Run UI Tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Choose browser
        required: true
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit

concurrency:
  group: demo-web-shop-ui-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Tests
    timeout-minutes: 30

    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://demowebshop.tricentis.com' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    outputs:
      good: ${{ steps.all.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ inputs.browser }}
      - name: Create config from the example
        run: |
          if [ ! -f config/settings.py ]; then
            cp config/settings.py config/settings.py
          fi
      - name: Run UI tests
        id: all
        # run: pytest -m all --alluredir=allure-results --numprocesses 2
        run: pytest --browser ${{ inputs.browser }}
        continue-on-error: true
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 1
          if-no-files-found: warn
      - name: Upload Playwright traces
        if: steps.all.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Fail the job if tests failed
        if: steps.all.outcome == 'failure'
        run: exit 1

  publish-report:
    if: always()
    needs: run-tests
    runs-on: ubuntu-latest
    name: Publish Allure Report
    permissions:
      contents: write

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.46.2/allure-2.46.2.tgz
          tar -xzf allure-2.46.2.tgz
          sudo mv allure-2.46.2 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report
      - name: Deploy Allure Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          force_orphan: true
      - name: Add Allure Dashboard link to Summary
        run: |
          echo "## Allure Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Open Allure Dashboard](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY
