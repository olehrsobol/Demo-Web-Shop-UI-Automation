name: Run Automated Tests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose target
        required: true
        type: choice
        default: all
        options:
          - all

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Tests

    outputs:
      good: ${{ steps.all.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UI tests
        id: all
        run: |
          pytest -m all --alluredir=allure-results --numprocesses 2
        continue-on-error: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 1
          if-no-files-found: warn

  publish-report:
    if: always()
    needs: run-tests
    runs-on: ubuntu-latest
    name: Publish Allure Dashboard

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.46.2/allure-2.46.2.tgz
          tar -xzf allure-2.46.2.tgz
          sudo mv allure-2.46.2 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          force_orphan: true
      
      - name: Add Allure Dashboard link to Summary
        run: |
          echo "## Allure Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Open Allure Dashboard](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY
